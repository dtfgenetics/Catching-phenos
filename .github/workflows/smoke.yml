name: PhenoQuest Project Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run project checks and self-contained build
        run: npm run check

      - name: Install Chromium smoke-test dependency
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Play through guided first-session surface
        run: node scripts/browser-smoke.mjs
